# Dependency updates for the three surfaces this repository pins: the Go
# module graph, the actions the workflows run, and the images the controller
# is built from. Weekly, bounded, and reviewed by hand — nothing here merges
# itself.
#
# What is deliberately NOT covered: the kind binary and the kindest/node
# images in the Makefile. Those are compatibility decisions — which
# Kubernetes versions ZoneRoute claims to support — and they are bumped
# through an issue and a pull request that runs the suite, never by a bot.
# The docker ecosystem below only reads Dockerfile, so it cannot reach them.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - kind/chore
    groups:
      # k8s.io/api, k8s.io/apimachinery and k8s.io/client-go share one
      # version line (all v0.36.x today) and are only valid together, so a
      # separate pull request per module would be noise that cannot be
      # merged on its own.
      #
      # sigs.k8s.io/controller-runtime is deliberately not in this group: it
      # has its own version series (v0.24.x) and a release of it may require
      # review against a specific Kubernetes line. It gets its own pull
      # request so that compatibility is judged, not absorbed.
      kubernetes:
        patterns:
          - 'k8s.io/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - kind/chore
      - area/ci
    groups:
      # Actions move independently and each one is a small, readable diff,
      # but the two families below are usually released together.
      actions:
        patterns:
          - 'actions/*'
      docker:
        patterns:
          - 'docker/*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - kind/chore
      - area/release
