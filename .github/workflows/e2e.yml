name: e2e

# The suite builds a kind cluster and takes about fifteen minutes, so it runs
# only when something it could actually break has changed. `paths-ignore`
# rather than `paths`: anything new — a package, a manifest directory — runs
# the suite by default, and only the paths listed here are known to be
# irrelevant to it.
#
# Documentation still gets tested: `verify` runs unfiltered, and docs/docs_test.go
# and config/install_test.go check the Markdown and the manifests there.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'LICENSE'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'LICENSE'
      - '.github/workflows/website.yml'

permissions: {}

# A newer commit on the same pull request cancels its stale run; every
# commit on main keeps its own run, so a later merge never erases an earlier
# commit's e2e result.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Functional suite on kind
        run: make test-e2e

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-diagnostics
          path: hack/.e2e/diag
          if-no-files-found: ignore
