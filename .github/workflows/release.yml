name: release

# Tag-driven. Pushing a SemVer tag validates, runs the full functional suite,
# builds and pushes the multi-platform image, then publishes a GitHub Release
# whose manifest pins the published digest.
#
# workflow_dispatch is a dry run: the same validation, the same e2e suite and
# the same two-platform build, but nothing is pushed and no release is made.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to dry-run, e.g. v0.1.0'
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mihnk/zoneroute

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release must not depend on a cache another workflow wrote.
          cache: false

      - name: Resolve and validate the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${INPUT_VERSION}"
          fi
          VERSION="$version" make release-check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generated files are up to date
        run: make verify-generate

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  e2e:
    name: e2e
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release must not depend on a cache another workflow wrote.
          cache: false

      - name: Functional suite on kind
        run: make test-e2e

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-e2e-diagnostics
          path: hack/.e2e/diag
          if-no-files-found: ignore

  build:
    name: build
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only a tag publishes, so only a tag authenticates.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An official version tag is immutable. If it already exists, this run
      # is either an accidental re-tag or a recovery rerun; recovery does not
      # rebuild, it reuses the published digest (see docs/release.md).
      - name: Check whether the version tag is already published
        id: existing
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
                --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "$IMAGE:$VERSION is already published as $digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
          fi

      # Dry run: both platforms are really built, nothing leaves the runner.
      - name: Build (dry run, no push)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Build and push
        id: push
        if: github.event_name == 'push' && steps.existing.outputs.digest == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.validate.outputs.version }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}

      # One digest for the rest of the workflow, whether this run pushed the
      # image or found it already published.
      - name: Resolve the published digest
        id: publish
        if: github.event_name == 'push'
        env:
          PUSHED: ${{ steps.push.outputs.digest }}
          EXISTING: ${{ steps.existing.outputs.digest }}
        run: |
          digest="${PUSHED:-$EXISTING}"
          if [ -z "$digest" ]; then
            echo "no digest: the image was neither pushed nor found" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published digest: $digest"

      - name: Attest build provenance
        if: github.event_name == 'push' && steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: release
    needs: [validate, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release must not depend on a cache another workflow wrote.
          cache: false

      - name: Render the release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir -p dist
          hack/release-manifest.sh > dist/install.yaml
          grep -q "image: $IMAGE@$DIGEST" dist/install.yaml
          hack/release-notes.sh > dist/notes.md
          (cd dist && sha256sum install.yaml > checksums.txt)
          cat dist/checksums.txt

      # The release stays a draft until every asset is uploaded, so a failure
      # above or below never shows a half-finished release to the public.
      # Rerunning this job updates the same draft.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=(--draft --title "$VERSION" --notes-file dist/notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --draft --notes-file dist/notes.md
          else
            gh release create "$VERSION" "${flags[@]}"
          fi
          gh release upload "$VERSION" dist/install.yaml dist/checksums.txt --clobber

      - name: Verify the assets, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          assets=$(gh release view "$VERSION" --json assets -q '[.assets[].name] | sort | join(",")')
          [ "$assets" = "checksums.txt,install.yaml" ] || {
            echo "unexpected assets: $assets" >&2; exit 1; }
          # A prerelease must not become the repository's "latest" release.
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "$VERSION" --draft=false --latest
          fi
          gh release view "$VERSION" --json isDraft,isPrerelease,url -q '.url'

  latest:
    name: latest
    needs: [validate, build, release]
    if: github.event_name == 'push' && needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Convenience only: the release manifest and the documentation always
      # name a digest or an exact version. Moving it last means a failure
      # here cannot leave a published release pointing at nothing.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at this release
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}'
