apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: zoneroute
    pod-security.kubernetes.io/enforce: restricted
  name: zoneroute-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: zoneroutes.dns.mihnk.org
spec:
  group: dns.mihnk.org
  names:
    kind: ZoneRoute
    listKind: ZoneRouteList
    plural: zoneroutes
    singular: zoneroute
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: ACCEPTED
      type: string
    - jsonPath: .status.conditions[?(@.type=="Published")].status
      name: PUBLISHED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZoneRoute forwards DNS queries for a set of zones to an ordered list of
          upstream resolvers, by publishing a CoreDNS configuration fragment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZoneRouteSpec describes which DNS zones are forwarded to
              which resolvers.
            properties:
              upstreams:
                description: |-
                  Upstreams lists the resolvers that answer for Zones. ORDER IS
                  SIGNIFICANT: the first upstream is tried before the second. Two
                  entries with the same address and port are not allowed.
                items:
                  description: Upstream is one DNS resolver.
                  properties:
                    address:
                      description: |-
                        Address is a canonical IPv4 or IPv6 address. Hostnames are not
                        accepted, and non-canonical forms such as "0:0:0:0:0:0:0:1" are
                        rejected so that addresses compare as plain strings.

                        ip.isCanonical is a plain function taking a string (see
                        k8s.io/apiserver/pkg/cel/library/ip.go); the member form
                        ip(x).isCanonical() shown in some documentation does not compile on
                        Kubernetes 1.31.
                      maxLength: 45
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: address must be a canonical IPv4 or IPv6 address
                        rule: isIP(self) && ip.isCanonical(self)
                    port:
                      default: 53
                      description: Port is the resolver's UDP/TCP port. Defaults to
                        53.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - address
                  type: object
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: upstreams must be unique by address and port
                  rule: self.all(i, self.filter(j, j.address == i.address && j.port
                    == i.port).size() == 1)
              zones:
                description: |-
                  Zones lists the DNS zones routed to Upstreams. Order has no meaning.
                  Names are compared case-insensitively and with the trailing dot
                  ignored, so "Example.COM" and "example.com." are the same zone and
                  may not both appear.
                items:
                  maxLength: 254
                  minLength: 1
                  pattern: ^(?i)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.?$
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
                x-kubernetes-validations:
                - message: zones must be unique ignoring case and trailing dot
                  rule: 'self.all(i, self.filter(j, (j.lowerAscii().endsWith(''.'')
                    ? j.lowerAscii().substring(0, size(j) - 1) : j.lowerAscii()) ==
                    (i.lowerAscii().endsWith(''.'') ? i.lowerAscii().substring(0,
                    size(i) - 1) : i.lowerAscii())).size() == 1)'
                - message: 'zone is reserved: localhost, in-addr.arpa and ip6.arpa
                    may not be routed'
                  rule: 'self.all(z, !((z.lowerAscii().endsWith(''.'') ? z.lowerAscii().substring(0,
                    size(z) - 1) : z.lowerAscii()) in [''localhost'', ''in-addr.arpa'',
                    ''ip6.arpa''] || z.lowerAscii().endsWith(''.localhost'') || z.lowerAscii().endsWith(''.localhost.'')
                    || z.lowerAscii().endsWith(''.in-addr.arpa'') || z.lowerAscii().endsWith(''.in-addr.arpa.'')
                    || z.lowerAscii().endsWith(''.ip6.arpa'') || z.lowerAscii().endsWith(''.ip6.arpa.'')))'
            required:
            - upstreams
            - zones
            type: object
          status:
            description: ZoneRouteStatus reports what the controller last observed
              and did.
            properties:
              conditions:
                description: Conditions holds the Accepted and Published conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the conditions
                  refer to.
                format: int64
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
